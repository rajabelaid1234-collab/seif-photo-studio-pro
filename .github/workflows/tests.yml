name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "Pillow>=10.0" "numpy>=1.26" "pytest>=8.0"
      - run: python -m py_compile streamlit_app.py image_processing.py storage.py tests/test_image_processing.py tests/test_storage.py
      - run: python -m pytest -q
